name: Repo map
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build repo-map.txt
        run: |
          set +e
          section() { printf '\n\n===== %s =====\n' "$1"; }
          {
            section "TOP LEVEL"
            ls -1

            section "SETTINGS (modules)"
            cat settings.gradle.kts 2>/dev/null | head -120

            section "ROOT build.gradle.kts"
            head -120 build.gradle.kts 2>/dev/null

            section "gradle.properties"
            head -60 gradle.properties 2>/dev/null

            section "VERSION CATALOG (head)"
            head -250 gradle/libs.versions.toml 2>/dev/null

            section "app/build.gradle.kts"
            head -300 app/build.gradle.kts 2>/dev/null

            section "tv/build.gradle.kts"
            head -150 tv/build.gradle.kts 2>/dev/null

            section "JDK / SDK hints"
            git grep -nE "jvmToolchain|JavaVersion\.|jvmTarget|compileSdk|minSdk|targetSdk" -- '*.kts' 'buildSrc' | head -40

            section "SOURCE DIRECTORIES (file counts)"
            git ls-files | grep -E '\.(kt|kts|json|ya?ml|toml|properties)$' | grep -vE '^(\.idea|\.github|resources|fastlane)/' | xargs -n1 dirname | sort | uniq -c | head -600

            section "openapi folder"
            git ls-files openapi | head -60
            for f in $(git ls-files openapi | grep -E '\.(ya?ml|json)$' | head -3); do
              printf '\n--- %s (first 60 lines) ---\n' "$f"
              head -60 "$f"
            done

            section "FILES TOUCHING THE API / AUTH LAYER"
            git grep -lE "api\.trakt\.tv|trakt-api-key|TRAKT_API_KEY|Retrofit|HttpClient|OkHttp|oauth|OAuth|openapi" -- '*.kt' '*.kts' '*.xml' '*.properties' | head -250

            section "AGENTS.md"
            head -400 AGENTS.md 2>/dev/null

            section "CLAUDE.md"
            head -400 CLAUDE.md 2>/dev/null

            section "AndroidManifest (app) deep links"
            grep -nE "scheme|host|intent-filter|android:name=\"tv\." app/src/main/AndroidManifest.xml 2>/dev/null | head -60
          } > repo-map.txt
          wc -c repo-map.txt

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add repo-map.txt
          git commit -m "Add repo-map.txt" || echo "Nothing to commit"
          git push
